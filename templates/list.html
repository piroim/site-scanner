<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List - Site Scanner</title>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-has-history="{{ 'true' if has_history_file else 'false' }}">
    {% set nav_active = 'list' %}
    {% include 'includes/app_header.html' %}
    <aside class="sidebar vuln-sidebar">
        <div class="vuln-sidebar-actions">
            <button type="button" id="btnVulnRun" class="btn btn-primary vuln-run-btn" {% if not has_history_file %}disabled title="히스토리 필요"{% endif %}>
                다시 동기화
            </button>
            <div class="vuln-csv-actions">
                <button type="button" id="btnCsvSelected" class="btn btn-small vuln-csv-btn" disabled title="왼쪽에서 사이트를 선택한 뒤 사용">
                    CSV 저장
                </button>
                <button type="button" id="btnCsvZip" class="btn btn-small vuln-csv-btn" disabled title="사이트별 CSV를 ZIP으로">
                    전체 ZIP
                </button>
            </div>
        </div>
        <div class="vuln-site-list-header">
            <span>저장된 URL (사이트)</span>
            <span class="vuln-site-list-header-btns">
                <button type="button" id="btnVulnDeleteAll" class="btn-clear vuln-delete-all" title="access_list JSON 전부 삭제(히스토리는 유지)">전체 삭제</button>
                <button type="button" id="btnVulnRefresh" class="btn-clear vuln-refresh" title="목록 새로고침">↻</button>
            </span>
        </div>
        <div id="vulnSiteList" class="vuln-site-list">
            <div class="vuln-site-empty" id="vulnSiteEmpty">동기화 중이거나 저장된 사이트가 없습니다. 히스토리(scan_*.json)가 있으면 자동으로 채워집니다.</div>
        </div>
    </aside>

    <main class="main-content settings-content vuln-main">
        <div class="settings-header">
            <h1>API LIST</h1>
            <p class="settings-desc" id="vulnMainSubtitle">왼쪽에서 사이트를 선택하면 스캔에서 식별된 URL이 구역별로 표시됩니다.</p>
        </div>

        <div id="vulnMainPlaceholder" class="vuln-placeholder">
            <p>왼쪽 목록에서 사이트를 선택하세요.</p>
        </div>

        <div id="vulnMainContent" class="vuln-main-content u-hidden">
            <p class="vuln-meta" id="vulnMeta"></p>
            <div class="vuln-zones" id="vulnZones"></div>
            <p class="vuln-total" id="vulnTotal"></p>
        </div>
    </main>

    <template id="tplVulnZone">
        <section class="vuln-zone">
            <div class="vuln-zone-head">
                <h2 class="vuln-zone-title"></h2>
                <span class="vuln-zone-count"></span>
            </div>
            <p class="vuln-zone-hint">포커스 후 <kbd>Ctrl</kbd>+<kbd>A</kbd>로 복사</p>
            <div class="vuln-text-frame">
                <textarea class="vuln-url-textarea" readonly spellcheck="false" wrap="off"></textarea>
            </div>
        </section>
    </template>

    <script>
    (function () {
        const ZONES = [
            { key: 'get', label: 'GET', badge: 'method-badge get', sub: 'form · input' },
            { key: 'post', label: 'POST', badge: 'method-badge post', sub: 'form · input' },
            { key: 'link', label: 'LINK', badge: 'type-badge link', sub: 'a href' },
            { key: 'script', label: 'JS', badge: 'type-badge script', sub: 'script · AJAX' },
            { key: 'info', label: 'INFO', badge: 'type-badge info', sub: '패턴 탐지' }
        ];

        let selectedFilename = null;
        let lastListItems = [];

        function updateCsvButtons(items) {
            const zipBtn = document.getElementById('btnCsvZip');
            const selBtn = document.getElementById('btnCsvSelected');
            const hasItems = items && items.length > 0;
            zipBtn.disabled = !hasItems;
            selBtn.disabled = !hasItems || !selectedFilename;
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function loadList() {
            const res = await fetch('/api/access_list/list');
            const data = await res.json();
            const items = data.items || [];
            lastListItems = items;
            const listEl = document.getElementById('vulnSiteList');
            const emptyEl = document.getElementById('vulnSiteEmpty');
            if (!items.length) {
                listEl.innerHTML = '';
                listEl.appendChild(emptyEl);
                emptyEl.classList.remove('u-hidden');
                updateCsvButtons([]);
                return [];
            }
            emptyEl.classList.add('u-hidden');
            listEl.innerHTML = '';
            items.forEach(function (it) {
                const row = document.createElement('div');
                row.className = 'vuln-site-row';
                const sel = document.createElement('button');
                sel.type = 'button';
                sel.className = 'vuln-site-select' + (selectedFilename === it.filename ? ' active' : '');
                sel.textContent = it.site_label;
                sel.dataset.filename = it.filename;
                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'vuln-site-del';
                del.title = '이 사이트 저장 삭제 (해당 사이트가 들어 있는 히스토리 스냅샷도 함께 삭제될 수 있음)';
                del.innerHTML = '&times;';
                del.dataset.filename = it.filename;
                row.appendChild(sel);
                row.appendChild(del);
                listEl.appendChild(row);
            });
            updateCsvButtons(items);
            return items;
        }

        function renderDetail(record) {
            const sec = record.sections || {};
            const zones = document.getElementById('vulnZones');
            zones.innerHTML = '';
            const tpl = document.getElementById('tplVulnZone');

            ZONES.forEach(function (z) {
                const lines = sec[z.key] || [];
                const node = tpl.content.cloneNode(true);
                const title = node.querySelector('.vuln-zone-title');
                const count = node.querySelector('.vuln-zone-count');
                const ta = node.querySelector('textarea');

                title.innerHTML = '<span class="' + esc(z.badge) + '">' + esc(z.label) + '</span> ' +
                    '<span>' + esc(z.sub) + '</span>';
                count.textContent = lines.length + '건';
                ta.value = lines.join('\n');
                ta.rows = Math.max(4, Math.min(lines.length, 20) || 4);
                ta.setAttribute('aria-label', z.key === 'info' ? z.label + ' 내용' : z.label + ' URL');

                zones.appendChild(node);
            });

            const total = ZONES.reduce(function (a, z) {
                return a + (sec[z.key] || []).length;
            }, 0);
            document.getElementById('vulnTotal').textContent = '전체 ' + total + '건';
            document.getElementById('vulnMainPlaceholder').classList.add('u-hidden');
            document.getElementById('vulnMainContent').classList.remove('u-hidden');
        }

        async function selectFile(filename) {
            const res = await fetch('/api/access_list/file/' + encodeURIComponent(filename));
            if (!res.ok) {
                alert('불러오기 실패');
                return;
            }
            const record = await res.json();
            selectedFilename = filename;
            renderDetail(record);
            document.querySelectorAll('.vuln-site-select').forEach(function (b) {
                b.classList.toggle('active', b.dataset.filename === filename);
            });
            updateCsvButtons(lastListItems);
        }

        document.getElementById('vulnSiteList').addEventListener('click', function (e) {
            const t = e.target;
            if (t.classList.contains('vuln-site-select')) {
                selectFile(t.dataset.filename);
            }
            if (t.classList.contains('vuln-site-del')) {
                const fn = t.dataset.filename;
                if (!confirm(
                    'access_list 파일을 삭제합니다.\n' +
                    '이 사이트 URL이 포함된 히스토리(scan_data/history/scan_*.json)도 함께 삭제됩니다 ' +
                    '(한 파일에 여러 사이트가 있으면 파일 전체가 삭제됩니다).\n\n' + fn
                )) return;
                fetch('/api/access_list/file/' + encodeURIComponent(fn), { method: 'DELETE' })
                    .then(function (r) { return r.json(); })
                    .then(function (j) {
                        if (j.error) {
                            alert(j.error);
                            return;
                        }
                        if (j.history_deleted && j.history_deleted.length) {
                            alert('히스토리에서도 삭제됨:\n' + j.history_deleted.join('\n'));
                        }
                        if (selectedFilename === fn) {
                            selectedFilename = null;
                            document.getElementById('vulnMainContent').classList.add('u-hidden');
                            document.getElementById('vulnMainPlaceholder').classList.remove('u-hidden');
                        }
                        loadList().then(function (items) {
                            if (items && items.length) {
                                selectFile(items[0].filename);
                            }
                        });
                    });
            }
        });

        document.getElementById('btnVulnRefresh').addEventListener('click', loadList);

        document.getElementById('btnCsvSelected').addEventListener('click', function () {
            if (!selectedFilename) {
                alert('먼저 왼쪽 목록에서 사이트를 선택하세요.');
                return;
            }
            fetch('/api/access_list/export/csv/site', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: selectedFilename })
            })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                .then(function (x) {
                    if (!x.ok || x.j.error) {
                        alert(x.j.error || 'CSV 저장에 실패했습니다.');
                        return;
                    }
                    window.location.href = '/api/export/download/' + encodeURIComponent(x.j.filename);
                })
                .catch(function () { alert('요청 실패'); });
        });

        document.getElementById('btnCsvZip').addEventListener('click', function () {
            fetch('/api/access_list/export/csv/zip', { method: 'POST' })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                .then(function (x) {
                    if (!x.ok || x.j.error) {
                        alert(x.j.error || 'ZIP 저장에 실패했습니다.');
                        return;
                    }
                    window.location.href = '/api/export/download/' + encodeURIComponent(x.j.filename);
                })
                .catch(function () { alert('요청 실패'); });
        });

        document.getElementById('btnVulnDeleteAll').addEventListener('click', function () {
            if (!confirm(
                'scan_data/access_list/ 의 저장 목록과 scan_data/history/ 의 scan_*.json 스캔 히스토리를 모두 삭제합니다.\n\n' +
                '이 작업은 되돌릴 수 없습니다.\n\n' +
                '계속할까요?'
            )) return;
            fetch('/api/access_list/all', { method: 'DELETE' })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                .then(function (x) {
                    if (!x.ok || x.j.error) {
                        alert(x.j.error || '삭제 실패');
                        return;
                    }
                    const na = (x.j.deleted || []).length;
                    const nh = (x.j.history_deleted || []).length;
                    selectedFilename = null;
                    document.getElementById('vulnMainContent').classList.add('u-hidden');
                    document.getElementById('vulnMainPlaceholder').classList.remove('u-hidden');
                    loadList();
                    if (na === 0 && nh === 0) {
                        alert('삭제할 파일이 없었습니다.');
                    } else {
                        alert('삭제 완료: access_list ' + na + '개, history ' + nh + '개');
                    }
                })
                .catch(function () { alert('요청 실패'); });
        });

        function syncFromScan(showAlert) {
            return fetch('/api/access_list/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}'
            })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                .then(function (x) {
                    if (!x.ok) {
                        if (showAlert) {
                            alert(x.j.error || '동기화 실패');
                        } else {
                            console.warn('List 자동 동기화:', x.j.error || x.ok);
                        }
                        return null;
                    }
                    if (showAlert) {
                        const n = (x.j.summaries || []).length;
                        alert(n === 0
                            ? '저장할 사이트가 없습니다. 최근 히스토리의 sites가 비어 있을 수 있습니다.'
                            : ('동기화 완료: ' + n + '개 사이트'));
                    }
                    return x.j;
                })
                .catch(function (err) {
                    if (showAlert) {
                        alert('요청 실패');
                    } else {
                        console.warn('List 자동 동기화 요청 실패', err);
                    }
                    return null;
                });
        }

        document.getElementById('btnVulnRun').addEventListener('click', function () {
            const btn = this;
            if (btn.disabled) return;
            btn.disabled = true;
            syncFromScan(true)
                .then(function () { return loadList(); })
                .then(function (items) {
                    if (items && items.length) {
                        return selectFile(items[0].filename);
                    }
                })
                .finally(function () { btn.disabled = false; });
        });

        async function boot() {
            const hasHistory = document.body.getAttribute('data-has-history') === 'true';
            if (hasHistory) {
                await syncFromScan(false);
            }
            const items = await loadList();
            if (items.length) {
                await selectFile(items[0].filename);
            }
        }

        boot();
    })();
    </script>
</body>
</html>
